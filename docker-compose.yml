version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: chainora-postgres
    environment:
      POSTGRES_USER: chainora
      POSTGRES_PASSWORD: chainora
      POSTGRES_DB: chainora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainora -d chainora"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: golang:1.24
    working_dir: /app/src/migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chainora:chainora@postgres:5432/chainora?sslmode=disable
      MIGRATIONS_DIR: migrations
    volumes:
      - ./:/app
    command: ["go", "run", "."]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainora-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://chainora:chainora@postgres:5432/chainora?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
